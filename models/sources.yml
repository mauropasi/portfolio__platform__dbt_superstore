version: 2

sources:
  - name: raw
    description: "Raw operational Superstore data ingested and exposed by the platform runtime into DuckDB."
    tables:
      - name: orders
        description: "Raw retail sales orders transactions with customer, product, and financial attributes."
        columns:
          - name: "Row ID"
            description: "Unique row sequence number."
          - name: "Order ID"
            description: "Unique transaction identifier."
          - name: "Order Date"
            description: "Date the order was placed."
          - name: "Customer ID"
            description: "Unique identifier for the customer."
          - name: "Product ID"
            description: "Unique identifier for the product."
          - name: "Sales"
            description: "Total transaction gross sales value."

      - name: returns
        description: "Log of returned orders."
        columns:
          - name: "Order ID"
            description: "Foreign key referencing the returned order."
          - name: "Returned"
            description: "Return status flag ('Yes')."

      - name: people
        description: "Regional sales managers lookup table."
        columns:
          - name: "Region"
            description: "Geographic region (Central, East, South, West)."
          - name: "Regional Manager"
            description: "Full name of the regional sales executive."
