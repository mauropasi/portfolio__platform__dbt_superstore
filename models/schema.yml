version: 2

models:
  - name: stg_orders
    description: "Staging model cleaning and standardizing raw Superstore order lines."
    columns:
      - name: row_id
        description: "Primary key: unique row identifier."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Transaction order identifier."
        data_tests:
          - not_null
      - name: order_date
        description: "Date the order was placed."
        data_tests:
          - not_null
      - name: sales_amount
        description: "Gross revenue of the line item."
        data_tests:
          - not_null
      - name: quantity
        description: "Quantity of items ordered."
        data_tests:
          - not_null

  - name: stg_returns
    description: "Staging model identifying returned orders."
    columns:
      - name: order_id
        description: "Identifier of the returned order."
        data_tests:
          - not_null
      - name: is_returned
        description: "Boolean flag indicating whether the order was returned."
        data_tests:
          - not_null

  - name: stg_people
    description: "Staging model mapping sales regions to regional managers."
    columns:
      - name: region
        description: "Geographic sales region."
        data_tests:
          - unique
          - not_null
      - name: regional_manager
        description: "Name of the assigned regional manager."
        data_tests:
          - not_null
