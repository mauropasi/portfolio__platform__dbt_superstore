version: 2

models:
  - name: stg_users
    description: "Staging model for raw user seed data."
    columns:
      - name: user_id
        description: "Primary key for user."
        tests:
          - unique
          - not_null
      - name: user_name
        description: "Uppercased name of the user."
        tests:
          - not_null

  - name: stg_states
    description: "Staging model for US state seed data."
    columns:
      - name: state_code
        description: "Two-letter postal abbreviation (primary key)."
        tests:
          - unique
          - not_null
      - name: state_name
        description: "Uppercased full name of the state."
        tests:
          - unique
          - not_null
      - name: population
        description: "Estimated state population (2020 Census)."
        tests:
          - not_null
      - name: num_counties
        description: "Number of counties or county-equivalents."
        tests:
          - not_null
      - name: founded_year
        description: "Year the state was admitted to the Union."
        tests:
          - not_null
      - name: years_since_statehood
        description: "Number of years since the state was founded (as of 2024)."
        tests:
          - not_null
