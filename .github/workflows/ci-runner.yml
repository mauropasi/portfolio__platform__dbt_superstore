name: CI Runner

on:
  workflow_call:
    inputs:
      dbt_type:
        type: string
        default: 'duckdb'

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/dbt-platform-runtime:1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SQLFluff Lint
        run: |
          echo "==> Running SQLFluff lint..."
          sqlfluff lint models/

      - name: Inject Ephemeral CI Profile
        run: |
          mkdir -p /home/vscode/.dbt
          cat <<EOF > /home/vscode/.dbt/profiles.yml
          default:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: dev.duckdb
                schema: "pr_${{ github.event.pull_request.number || 'local' }}"
                threads: 4
          EOF

      - name: Execute dbt Build
        run: |
          echo "==> Executing dbt build..."
          dbt build
